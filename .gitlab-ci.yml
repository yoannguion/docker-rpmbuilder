# GitLab CI — docker-rpmbuilder
# Construit l'image RPM builder de la branche (el8, el9, el10…) et la publie sur Harbor :
#   harbor.forge.enovacom.cloud/enovacomdev/ci/docker-rpmbuilder:<branche>
# Un seul tag par branche : l'image précédente perd son tag et la rétention quotidienne
# d'enovacomdev (qui ne garde que les artefacts tagués) la supprime.
# Même fichier sur toutes les branches : le tag est tiré du nom de la branche.
#
# Déclencheurs : push sur la branche, pipeline planifié (Build > Pipeline schedules, pour
# récupérer les mises à jour de l'OS) ou lancement manuel (Build > Pipelines > Run pipeline).
#
# Variables CI/CD du groupe devops : HARBOR_URL (avec https://), HARBOR_USER, HARBOR_PASSWORD.

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^el[0-9]+$/'

stages:
  - build

image:build:
  stage: build
  tags: [ovh-docker-dind]   # docker build → besoin du daemon (dind)
  image: docker:27
  services: [docker:27-dind]
  variables:
    # dind SANS TLS (port 2375) : le runner ne partage pas le volume /certs du service.
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    HARBOR_REPOSITORY: "enovacomdev/ci/docker-rpmbuilder"
  script:
    - REGISTRY="${HARBOR_URL#https://}"
    - IMAGE="$REGISTRY/$HARBOR_REPOSITORY"
    - echo "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u "$HARBOR_USER" --password-stdin
    # --pull : toujours repartir de la dernière image de base (correctifs OS).
    - >
      docker build --pull
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      -t "$IMAGE:$CI_COMMIT_BRANCH"
      .
    - docker push "$IMAGE:$CI_COMMIT_BRANCH"
